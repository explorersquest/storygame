<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gedankenhimmel</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at top,
        #0a1020 0%,
        #050816 55%,
        #02030a 100%);

    color:white;
}

/* TITLE */

#title{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    font-size:14px;
    letter-spacing:1px;

    color:rgba(255,255,255,0.5);

    text-shadow:0 0 10px rgba(255,255,255,0.08);

    pointer-events:none;
}

/* OVERLAY */

#overlay{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);

    z-index:9999;

    transition:opacity 1s ease;
}

/* ENTER */

#enterBtn{
    padding:18px 46px;

    border:none;
    border-radius:20px;

    font-size:22px;

    color:white;

    background:
        linear-gradient(135deg,
        rgba(120,140,255,0.25),
        rgba(255,255,255,0.06));

    box-shadow:
        0 0 40px rgba(120,140,255,0.25),
        inset 0 0 18px rgba(255,255,255,0.06);

    cursor:pointer;

    transition:0.3s;
}

#enterBtn:hover{
    transform:scale(1.05);
}

/* SKY */

#sky{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* THOUGHT */

@keyframes heartbeat {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 0.72; }
    25%  { transform: translate(-50%, -50%) scale(1.01); opacity: 0.78; }
    50%  { transform: translate(-50%, -50%) scale(1); opacity: 0.74; }
    75%  { transform: translate(-50%, -50%) scale(1.01); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0.72; }
}

@keyframes fadein{
    from{
        opacity:0;
        transform:
            translate(-50%, -50%)
            scale(0.96);
    }

    to{
        opacity:0.9;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

.thought{
    opacity:0.9;

    position:absolute;

    color:rgba(255,255,255,0.78);

    text-shadow:
        0 0 10px rgba(255,255,255,0.15);

    line-height:1.5;

    overflow-wrap:break-word;

    text-align:center;

    animation:
        heartbeat 10s ease-in-out infinite,
        fadein 1.5s ease;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

/* INPUT */

#bar{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    width:min(90%,650px);

    display:flex;
    gap:12px;

    padding:14px;

    border-radius:20px;

    background:rgba(255,255,255,0.06);

    backdrop-filter: blur(14px);

    z-index:100;
}

#input{
    flex:1;

    border:none;
    outline:none;

    padding:14px;

    border-radius:14px;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(120,140,255,0.08),
            rgba(255,255,255,0.04)
        );
}

#input::placeholder{
    color:rgba(255,255,255,0.5);
}

#send{
    border:none;
    border-radius:14px;
    padding:0 20px;

    background:rgba(255,255,255,0.1);
    color:white;

    cursor:pointer;

    transition:0.2s;
}

#send:hover{
    background:rgba(255,255,255,0.16);
}

/* HOLD BUTTON */

#holdWrap{
    position:fixed;
    bottom:105px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
}

#holdBtn{
    border:none;

    padding:12px 26px;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

    color:rgba(255,255,255,0.8);

    backdrop-filter:blur(10px);

    cursor:pointer;

    transition:
        transform 0.15s,
        background 0.2s,
        box-shadow 0.2s;
}

#holdBtn:hover{
    background:rgba(255,255,255,0.12);
}

#holdBtn.holding{

    transform:scale(1.08);

    background:
        linear-gradient(
            135deg,
            rgba(160,180,255,0.35),
            rgba(255,255,255,0.12)
        );

    box-shadow:
        0 0 30px rgba(160,180,255,0.35),
        inset 0 0 12px rgba(255,255,255,0.08);

    color:white;
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.8;
}

/* SHOOTING STAR */

.shooting-star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    transform:rotate(-45deg);
}

.shooting-star::after{
    content:'';
    position:absolute;
    left:-80px;
    width:80px;
    height:2px;
    background:linear-gradient(90deg,transparent,white);
}

@keyframes shoot{
    from{
        transform:translate(0,0) rotate(-45deg);
        opacity:1;
    }

    to{
        transform:translate(-1000px,1000px) rotate(-45deg);
        opacity:0;
    }
}

/* ========================= */
/* NEW: MOON MOUSE GLOW ONLY */
/* ========================= */

#glow{
    position:fixed;
    width:200px;
    height:200px;

    border-radius:50%;

    pointer-events:none;

    transform:translate(-50%, -50%);

    background:radial-gradient(circle,
        rgba(140,170,255,0.25),
        rgba(140,170,255,0.10),
        transparent 70%);

    filter:blur(18px);

    mix-blend-mode:screen;

    z-index:5;
}

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>

<body>

<!-- NEW GLOW ELEMENT -->
<div id="glow"></div>

<div id="title">falls du was loswerden willst</div>

<div id="overlay">
    <button id="enterBtn">Enter</button>
</div>

<div id="sky"></div>

<div id="holdWrap">
    <button id="holdBtn">Festhalten</button>
</div>

<div id="bar">
    <input id="input" maxlength="400" placeholder="Schreib einen Gedanken...">
    <button id="send">Senden</button>
</div>

<audio id="bg" src="momedeiros88-mystical.mp3" loop></audio>
<audio id="type" src="game-text.mp3" loop></audio>
<audio id="click" src="magic-button-click.mp3"></audio>

<script>

/* FIREBASE */

firebase.initializeApp({
    apiKey: "AIzaSyD_cDHNMZZiLuGLfAntYAc8ONtKgwYlp9Y",
    authDomain: "luisaglobalchat.firebaseapp.com",
    projectId: "luisaglobalchat"
});

const db = firebase.firestore();

/* DEVICE */

let device = localStorage.getItem("device");

if(!device){
    device = "d_" + Math.random().toString(36).slice(2,10);
    localStorage.setItem("device", device);
}

/* LOGIN */

db.collection("Login").add({
    device,
    time: firebase.firestore.FieldValue.serverTimestamp()
});

/* ELEMENTS */

const enterBtn = document.getElementById("enterBtn");
const overlay = document.getElementById("overlay");
const input = document.getElementById("input");
const send = document.getElementById("send");
const sky = document.getElementById("sky");
const holdBtn = document.getElementById("holdBtn");
const glow = document.getElementById("glow");

/* AUDIO */

const bg = document.getElementById("bg");
const type = document.getElementById("type");
const click = document.getElementById("click");

/* ENTER */

enterBtn.onclick = ()=>{

    bg.play().catch(()=>{});

    overlay.style.opacity = 0;

    setTimeout(()=>{
        overlay.remove();
    },1000);
};

/* REST OF YOUR ORIGINAL CODE (UNCHANGED) */

let device2 = device; // untouched system continues

let thoughts=[];

async function load(){

    const snap=await db.collection("Gedanken").get();

    let list=[];

    snap.forEach(d=>{
        const data=d.data();
        if(data.text){
            list.push({text:data.text});
        }
    });

    thoughts=list.map(x=>x.text);
    render();
}

function render(){

    sky.querySelectorAll(".thought")
        .forEach(e=>e.remove());

    if(!thoughts.length) return;

    const text =
        thoughts[Math.floor(Math.random()*thoughts.length)];

    const div=document.createElement("div");

    div.className="thought";
    div.innerText=text;

    div.style.left="50%";
    div.style.top="50%";

    div.style.transform="translate(-50%,-50%)";

    sky.appendChild(div);
}

/* LOOP */

let hold=false;

function loop(){
    if(!hold) load();
    setTimeout(loop,12000+Math.random()*8000);
}

load();
loop();

/* HOLD */

holdBtn.onmousedown=()=>{hold=true;holdBtn.classList.add("holding");}
window.onmouseup=()=>{hold=false;holdBtn.classList.remove("holding");}

/* ========================= */
/* NEW: MOON + MOUSE GLOW    */
/* ========================= */

let mx=window.innerWidth/2;
let my=window.innerHeight/2;

let gx=mx;
let gy=my;

window.addEventListener("mousemove",(e)=>{
    mx=e.clientX;
    my=e.clientY;
});

function moonStrength(){

    const now=new Date();
    const cycle=29.53*24*60*60*1000;
    const known=new Date("2024-01-11").getTime();

    const phase=((now-known)%cycle)/cycle;

    return Math.abs(Math.cos(phase*Math.PI));
}

const strength=moonStrength();

glow.style.width=120+strength*200+"px";
glow.style.height=120+strength*200+"px";
glow.style.opacity=0.05+strength*0.25;

function animateGlow(){

    gx+=(mx-gx)*0.08;
    gy+=(my-gy)*0.08;

    glow.style.left=gx+"px";
    glow.style.top=gy+"px";

    requestAnimationFrame(animateGlow);
}

animateGlow();

</script>

</body>
</html>
