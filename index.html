<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gedankenhimmel</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at top,
        #0b1020 0%,
        #050816 55%,
        #02030a 100%);

    color:white;
}

/* OVERLAY */

#overlay{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);

    z-index:9999;
}

/* ENTER */

#enterBtn{
    padding:18px 46px;

    border:none;
    border-radius:20px;

    font-size:22px;

    color:rgba(255,255,255,0.95);

    background:
        linear-gradient(135deg,
        rgba(120,140,255,0.25),
        rgba(255,255,255,0.06));

    backdrop-filter: blur(12px);

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 0 35px rgba(120,140,255,0.25),
        inset 0 0 18px rgba(255,255,255,0.06);
}

#enterBtn:hover{
    transform:scale(1.05);
    box-shadow:
        0 0 60px rgba(140,160,255,0.35);
}

/* SKY */

#sky{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* THOUGHTS */

.thought{
    position:absolute;

    color:rgba(255,255,255,0.75);

    text-shadow:0 0 10px rgba(255,255,255,0.12);

    animation:fade 18s ease forwards;

    border-radius:14px;

    background:rgba(255,255,255,0.04);

    backdrop-filter: blur(10px);

    padding:10px 14px;

    max-width:360px;

    overflow-wrap:break-word;
}

@keyframes fade{
    0%{opacity:0;}
    10%{opacity:1;}
    85%{opacity:1;}
    100%{opacity:0;}
}

/* INPUT BAR */

#bar{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    width:min(90%,650px);

    display:flex;
    gap:12px;

    padding:14px;

    border-radius:20px;

    background:rgba(255,255,255,0.06);

    backdrop-filter: blur(14px);
}

/* INPUT */

#input{
    flex:1;

    border:none;
    outline:none;

    padding:14px 16px;

    border-radius:14px;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(120,140,255,0.08),
            rgba(255,255,255,0.04)
        );

    backdrop-filter: blur(14px);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,0.05),
        0 0 25px rgba(120,140,255,0.08);
}

#input:focus{
    box-shadow:
        0 0 35px rgba(120,140,255,0.2),
        inset 0 0 25px rgba(255,255,255,0.08);
}

/* BUTTON */

#send{
    border:none;

    padding:0 22px;

    border-radius:14px;

    cursor:pointer;

    background:rgba(255,255,255,0.1);

    color:white;
}

#send:hover{
    background:rgba(255,255,255,0.18);
}

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div id="overlay">
    <button id="enterBtn">Enter</button>
</div>

<div id="sky"></div>

<div id="bar">
    <input id="input" maxlength="400" placeholder="Schreib einen Gedanken...">
    <button id="send">Senden</button>
</div>

<audio id="bg" src="momedeiros88-mystical.mp3" loop></audio>
<audio id="type" src="game-text.mp3" loop></audio>
<audio id="click" src="magic-button-click.mp3"></audio>

<script>

/* FIREBASE */

firebase.initializeApp({
    apiKey: "AIzaSyD_cDHNMZZiLuGLfAntYAc8ONtKgwYlp9Y",
    authDomain: "luisaglobalchat.firebaseapp.com",
    projectId: "luisaglobalchat"
});

const db = firebase.firestore();

/* DEVICE */

let device =
    localStorage.getItem("device");

if(!device){
    device = "d_" + Math.random().toString(36).slice(2,10);
    localStorage.setItem("device", device);
}

/* LOGIN */

db.collection("Login").add({
    device,
    time: firebase.firestore.FieldValue.serverTimestamp()
});

/* ELEMENTE */

const overlay = document.getElementById("overlay");
const enterBtn = document.getElementById("enterBtn");
const input = document.getElementById("input");
const send = document.getElementById("send");
const sky = document.getElementById("sky");

/* AUDIO */

const bg = document.getElementById("bg");
const type = document.getElementById("type");
const click = document.getElementById("click");

bg.volume = 0.4;
type.volume = 0.12;

/* ENTER */

enterBtn.onclick = ()=>{
    bg.play().catch(()=>{});
    overlay.style.opacity = 0;
    setTimeout(()=>overlay.remove(),1000);
};

/* TYPING */

let typing = false;
let timeout;

input.addEventListener("input", ()=>{

    if(!typing){
        type.play().catch(()=>{});
        typing = true;
    }

    clearTimeout(timeout);

    timeout = setTimeout(()=>{
        type.pause();
        type.currentTime = 0;
        typing = false;
    }, 1200);
});

/* SEND */

async function sendThought(){

    const text = input.value.trim();
    if(!text) return;

    click.currentTime = 0;
    click.play().catch(()=>{});

    await db.collection("Gedanken").add({
        text,
        device,
        time: firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value = "";
    load();
}

send.onclick = sendThought;

input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        e.preventDefault();
        sendThought();
    }
});

/* LOAD */

let thoughts = [];

async function load(){

    const snap = await db.collection("Gedanken").get();

    const list = [];

    snap.forEach(d=>{
        const t = d.data().text;
        if(t) list.push(t);
    });

    thoughts = [...new Set(list)];
    render();
}

/* RENDER */

function render(){

    sky.innerHTML = "";

    if(thoughts.length === 0) return;

    const count = Math.min(4, thoughts.length);

    const shuffled = [...thoughts].sort(()=>Math.random()-0.5);

    const padding = 120;

    for(let i=0;i<count;i++){

        const div = document.createElement("div");
        div.className = "thought";

        div.innerText = shuffled[i];

        const x = padding + Math.random()*(window.innerWidth - padding*2);
        const y = padding + Math.random()*(window.innerHeight - padding*2);

        div.style.left = x + "px";
        div.style.top = y + "px";

        div.style.fontSize =
            Math.max(14, Math.min(20, window.innerWidth/60)) + "px";

        sky.appendChild(div);
    }
}

/* LOOP 2–4 min */

function loop(){

    load();

    const t = (2 + Math.random()*2) * 60000;

    setTimeout(loop, t);
}

load();
loop();

</script>

</body>
</html>
