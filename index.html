<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gedankenhimmel</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at top,
        #0a1020 0%,
        #050816 55%,
        #02030a 100%);

    color:white;
}

/* TITLE */

#title{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    font-size:14px;
    letter-spacing:1px;

    color:rgba(255,255,255,0.5);

    text-shadow:0 0 10px rgba(255,255,255,0.08);

    pointer-events:none;
}

/* OVERLAY */

#overlay{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);

    z-index:9999;
}

/* ENTER */

#enterBtn{
    padding:18px 46px;

    border:none;
    border-radius:20px;

    font-size:22px;

    color:white;

    background:
        linear-gradient(135deg,
        rgba(120,140,255,0.25),
        rgba(255,255,255,0.06));

    box-shadow:
        0 0 40px rgba(120,140,255,0.25),
        inset 0 0 18px rgba(255,255,255,0.06);

    cursor:pointer;

    transition:0.3s;
}

#enterBtn:hover{
    transform:scale(1.05);
}

/* SKY */

#sky{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* THOUGHTS */

@keyframes heartbeat {
    0%   { transform: scale(1);   opacity: 0.75; }
    20%  { transform: scale(1.02); opacity: 0.9; }
    40%  { transform: scale(1);   opacity: 0.78; }
    60%  { transform: scale(1.03); opacity: 0.92; }
    100% { transform: scale(1);   opacity: 0.75; }
}

.thought{
    opacity:0.9;
    
    position:absolute;

    max-width:360px;

    color:rgba(255,255,255,0.78);

    text-shadow:
        0 0 10px rgba(255,255,255,0.15);

    font-size:18px;

    line-height:1.4;

    overflow-wrap:break-word;

    padding:0;

    background:none;

    backdrop-filter:none;

    border-radius:0;

    animation: heartbeat 6s ease-in-out infinite;
}

/* INPUT */

#bar{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    width:min(90%,650px);

    display:flex;
    gap:12px;

    padding:14px;

    border-radius:20px;

    background:rgba(255,255,255,0.06);

    backdrop-filter: blur(14px);
}

#input{
    flex:1;

    border:none;
    outline:none;

    padding:14px;

    border-radius:14px;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(120,140,255,0.08),
            rgba(255,255,255,0.04)
        );
}

#send{
    border:none;
    border-radius:14px;
    padding:0 20px;

    background:rgba(255,255,255,0.1);
    color:white;

    cursor:pointer;
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.8;
}

/* SHOOTING STAR */

.shooting-star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    transform:rotate(-45deg);
}

.shooting-star::after{
    content:'';
    position:absolute;
    left:-80px;
    width:80px;
    height:2px;
    background:linear-gradient(90deg,transparent,white);
}

@keyframes shoot{
    from{transform:translate(0,0) rotate(-45deg);opacity:1;}
    to{transform:translate(-1000px,1000px) rotate(-45deg);opacity:0;}
}

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div id="title">falls du was loswerden willst</div>

<div id="overlay">
    <button id="enterBtn">Enter</button>
</div>

<div id="sky"></div>

<div id="bar">
    <input id="input" maxlength="400" placeholder="Schreib einen Gedanken...">
    <button id="send">Senden</button>
</div>

<audio id="bg" src="momedeiros88-mystical.mp3" loop></audio>
<audio id="type" src="game-text.mp3" loop></audio>
<audio id="click" src="magic-button-click.mp3"></audio>

<script>

/* FIREBASE */

firebase.initializeApp({
    apiKey: "AIzaSyD_cDHNMZZiLuGLfAntYAc8ONtKgwYlp9Y",
    authDomain: "luisaglobalchat.firebaseapp.com",
    projectId: "luisaglobalchat"
});

const db = firebase.firestore();

/* DEVICE */

let device = localStorage.getItem("device");

if(!device){
    device = "d_" + Math.random().toString(36).slice(2,10);
    localStorage.setItem("device", device);
}

/* LOGIN */

db.collection("Login").add({
    device,
    time: firebase.firestore.FieldValue.serverTimestamp()
});

/* ELEMENTE */

const enterBtn = document.getElementById("enterBtn");
const overlay = document.getElementById("overlay");
const input = document.getElementById("input");
const send = document.getElementById("send");
const sky = document.getElementById("sky");

/* AUDIO */

const bg = document.getElementById("bg");
const type = document.getElementById("type");
const click = document.getElementById("click");

type.volume = 0.08;
click.volume = 0.08;
bg.volume = 0.4;

/* ENTER */

enterBtn.onclick = ()=>{
    bg.play().catch(()=>{});
    overlay.style.opacity=0;
    setTimeout(()=>overlay.remove(),1000);
};

/* STARS */

for(let i=0;i<120;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.top=Math.random()*100+"%";
    s.style.left=Math.random()*100+"%";
    sky.appendChild(s);
}

/* SHOOTING STARS */

setInterval(()=>{
    if(Math.random()<0.5){
        const s=document.createElement("div");
        s.className="shooting-star";
        s.style.left=(Math.random()*window.innerWidth)+"px";
        s.style.top="-20px";
        s.style.animation="shoot 1.5s linear forwards";
        sky.appendChild(s);
        setTimeout(()=>s.remove(),1500);
    }
},6000);

/* TYPING SOUND */

let typing=false;
let timeout;

input.addEventListener("input",()=>{

    type.currentTime=0;
    type.play().catch(()=>{});

    typing=true;

    clearTimeout(timeout);

    timeout=setTimeout(()=>{
        type.pause();
        type.currentTime=0;
        typing=false;
    },180);
});

/* SEND */

async function sendThought(){

    const text=input.value.trim();
    if(!text) return;

    click.currentTime=0;
    click.play().catch(()=>{});

    await db.collection("Gedanken").add({
        text,
        device,
        time:firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value="";

    load();
}

send.onclick=sendThought;

input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        e.preventDefault();
        sendThought();
    }
});

/* LOAD */

let thoughts=[];

async function load(){

    const snap=await db.collection("Gedanken").get();

    let list=[];

    snap.forEach(d=>{
        const data=d.data();
        if(data.text){
            list.push({
                text:data.text,
                time:data.time?data.time.toMillis():0
            });
        }
    });

    /* NEU: nach Zeit sortieren (neueste zuerst) */
    list.sort((a,b)=>b.time-a.time);

    thoughts=list.map(x=>x.text);

    render();
}

/* RENDER (max 4, neueste bevorzugt) */

function render(){

    sky.querySelectorAll(".thought").forEach(e=>e.remove());

    if(thoughts.length===0) return;

    const count=Math.min(4,thoughts.length);

    const newestFirst=thoughts.slice(0,count);

    for(let i=0;i<count;i++){

        const div=document.createElement("div");
        div.className="thought";

        div.innerText=newestFirst[i];

        div.style.left=(80+Math.random()*(window.innerWidth-160))+"px";
        div.style.top=(80+Math.random()*(window.innerHeight-160))+"px";

        div.style.fontSize=
            Math.max(14,Math.min(20,window.innerWidth/60))+"px";

        sky.appendChild(div);
    }
}

/* LOOP 2–4 min */

function loop(){
    load();
    setTimeout(loop,(2+Math.random()*2)*60000);
}

load();
loop();

</script>

</body>
</html>
