<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gedankenhimmel</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at top,
        #0b1020 0%,
        #050816 50%,
        #02030a 100%);

    color:white;
}

/* OVERLAY */

#overlay{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);

    z-index:9999;
}

/* ENTER BUTTON */

#enterBtn{
    padding:18px 46px;

    border:none;
    border-radius:20px;

    font-size:22px;

    color:rgba(255,255,255,0.95);

    background:
        linear-gradient(135deg,
        rgba(120,140,255,0.25),
        rgba(255,255,255,0.06));

    backdrop-filter: blur(12px);

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 0 30px rgba(120,140,255,0.25),
        0 0 80px rgba(120,140,255,0.08),
        inset 0 0 18px rgba(255,255,255,0.06);

    text-shadow:0 0 8px rgba(255,255,255,0.2);
}

#enterBtn:hover{
    transform:scale(1.05);
    box-shadow:
        0 0 40px rgba(140,160,255,0.4),
        0 0 100px rgba(140,160,255,0.15);
}

/* STERNE */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.8;
}

/* GEDANKEN */

#sky{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.thought{
    position:absolute;
    max-width:320px;
    font-size:18px;
    color:rgba(255,255,255,0.75);
    text-shadow:0 0 10px rgba(255,255,255,0.12);
    animation: fade 18s ease forwards;
}

@keyframes fade{
    0%{opacity:0;}
    10%{opacity:1;}
    85%{opacity:1;}
    100%{opacity:0;}
}

/* INPUT */

#inputBar{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    width:min(90%,650px);

    display:flex;
    gap:12px;

    padding:14px;

    background:rgba(255,255,255,0.06);
    backdrop-filter: blur(14px);

    border-radius:20px;
}

#input{
    flex:1;
    border:none;
    outline:none;

    padding:14px;

    border-radius:14px;

    background:rgba(255,255,255,0.06);
    color:white;
}

#send{
    border:none;
    border-radius:14px;
    padding:0 22px;

    cursor:pointer;

    background:rgba(255,255,255,0.1);
    color:white;
}

#send:hover{
    background:rgba(255,255,255,0.18);
}

</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div id="overlay">
    <button id="enterBtn">Enter</button>
</div>

<div id="sky"></div>

<div id="inputBar">
    <input id="input" maxlength="400" placeholder="Schreib einen Gedanken...">
    <button id="send">Senden</button>
</div>

<audio id="bg" src="momedeiros88-mystical.mp3" loop></audio>
<audio id="type" src="game-text.mp3" loop></audio>
<audio id="sendSound" src="soft-click.mp3"></audio>

<script>

/* FIREBASE */

firebase.initializeApp({
    apiKey: "AIzaSyD_cDHNMZZiLuGLfAntYAc8ONtKgwYlp9Y",
    authDomain: "luisaglobalchat.firebaseapp.com",
    projectId: "luisaglobalchat"
});

const db = firebase.firestore();

/* DEVICE */

let device =
    localStorage.getItem("device");

if(!device){
    device = "d_" + Math.random().toString(36).slice(2,10);
    localStorage.setItem("device", device);
}

/* LOGIN */

db.collection("Login").add({
    device,
    time: firebase.firestore.FieldValue.serverTimestamp()
});

/* ELEMENTE */

const enterBtn = document.getElementById("enterBtn");
const overlay = document.getElementById("overlay");
const input = document.getElementById("input");
const send = document.getElementById("send");
const sky = document.getElementById("sky");

/* AUDIO */

const bg = document.getElementById("bg");
const type = document.getElementById("type");
const sendSound = document.getElementById("sendSound");

bg.volume = 0.4;
type.volume = 0.15;

/* ENTER */

enterBtn.onclick = ()=>{
    bg.play().catch(()=>{});
    overlay.style.opacity = 0;
    setTimeout(()=>overlay.remove(),1000);
};

/* TYPING SOUND */

let typing = false;
let typingTimeout;

input.addEventListener("input", ()=>{

    if(!typing){
        type.play().catch(()=>{});
        typing = true;
    }

    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(()=>{
        type.pause();
        typing = false;
    },600);
});

/* SEND */

async function sendThought(){

    const text = input.value.trim();
    if(!text) return;

    sendSound.currentTime = 0;
    sendSound.play().catch(()=>{});

    await db.collection("Gedanken").add({
        text,
        device,
        time: firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value = "";

    load();
}

send.onclick = sendThought;

input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        e.preventDefault();
        sendThought();
    }
});

/* LOAD + ROTATE */

let thoughts = [];

async function load(){

    const snap = await db.collection("Gedanken").get();

    const list = [];

    snap.forEach(d=>{
        const t = d.data().text;
        if(t) list.push(t);
    });

    thoughts = [...new Set(list)]; // keine doppelten global

    render();
}

/* RENDER */

function render(){

    sky.innerHTML = "";

    if(thoughts.length === 0) return;

    const count = Math.min(3, thoughts.length);

    const shuffled = [...thoughts].sort(()=>Math.random()-0.5);

    for(let i=0;i<count;i++){

        const div = document.createElement("div");
        div.className = "thought";
        div.innerText = shuffled[i];

        div.style.top = (10 + Math.random()*70) + "%";
        div.style.left = (5 + Math.random()*70) + "%";

        sky.appendChild(div);
    }
}

/* REFRESH LOOP 2–4 min */

function loop(){

    load();

    const t = (2 + Math.random()*2) * 60000;

    setTimeout(loop, t);
}

load();
loop();

/* STARS */

for(let i=0;i<120;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.top=Math.random()*100+"%";
    s.style.left=Math.random()*100+"%";
    document.body.appendChild(s);
}

</script>

</body>
</html>
